# tazchroot configuration
#
# Lookup order (last wins):
#   /etc/slitaz/tazchroot.conf
#   ~/.slitaz/tazchroot.conf
#   ./tazchroot.conf
#

# Host directory hosting the chroot and shared build dirs.
SLITAZ_HOME="$HOME/.slitaz"

# Path to the SliTaz rootfs (extracted).
CHROOT="$SLITAZ_HOME/chroot"

# SliTaz Live ISO. tazchroot mounts it loop-ro, extracts boot/rootfs.gz
# (or layered rootfs[1-4].gz) into $CHROOT, then unmounts.
# Cached at $SLITAZ_HOME/iso/.
ISO_URL="https://people.slitaz.org/~shann/slitaz-current64-stuff/slitaz-current64-core64-grub2.iso"

# Default unprivileged user for `setup-user` / `enter-user`. The user is
# created inside the chroot with the same UID as on the host, so files in
# bind-mounted dirs keep consistent ownership. Defaults to $SUDO_USER (the
# user who invoked sudo), then $USER.
#BUILDER="$SUDO_USER"
