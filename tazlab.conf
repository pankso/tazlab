# tazlab configuration
#
# Lookup order (last wins):
#   /etc/slitaz/tazlab.conf
#   ~/.slitaz/tazlab.conf
#   ./tazlab.conf
#

# Host directory hosting the chroot and shared build dirs.
SLITAZ_HOME="$HOME/.slitaz"

# Active architecture for chroot operations (i486 | x86_64).
# Can be overridden per-command: tazlab setup i486
ARCH="x86_64"

# Per-architecture ISO URLs. tazlab mounts the ISO loop-ro, extracts
# boot/rootfs.gz (or layered rootfs[1-4].gz) into the chroot, then unmounts.
# Cached at $SLITAZ_HOME/iso/.
#ISO_URL_i486="http://mirror.slitaz.org/iso/rolling/slitaz-rolling.iso"
#ISO_URL_x86_64="https://people.slitaz.org/~shann/slitaz-current64-stuff/slitaz-current64-core64-grub2.iso"

# Default unprivileged user for `setup-user` / `enter-user`. The user is
# created inside the chroot with the same UID as on the host, so files in
# bind-mounted dirs keep consistent ownership. Defaults to $SUDO_USER (the
# user who invoked sudo), then $USER.
#BUILDER="$SUDO_USER"

# Extra HG repos to clone alongside wok (space-separated).
#REPOS_LIST="cookutils slitaz-base-files slitaz-boot-scripts"

# Base URL for HG repos. Wok is cloned per-architecture from $HG_BASE/wok.
#HG_BASE="https://hg.slitaz.org"

# Qemu defaults.
#QEMU_MEM="512M"
#QEMU_SMP="2"
#QEMU_ARGS="-net nic -net user"
